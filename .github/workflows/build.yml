# Builds Welder (Welder) for Windows, Linux and macOS (Apple silicon and Intel) on GitHub's machines.
# Every push / pull request: build + self-tests. A tag (v0.2.0 ...): also a GitHub Release with
# every download attached. Run by hand: Actions > build > Run workflow.
name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]  # a release made on GitHub's site: build and attach every download
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which builds"
        type: choice
        options: [all, macos, linux, windows]
        default: all
      mac_deps:
        description: "Mac: build OpenColorIO, FFmpeg and ncnn too (off = a quick compile check, far fewer minutes)"
        type: boolean
        default: true

# one build per branch / tag at a time (a release can arrive as both its tag and its publishing)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    # AlmaLinux 8 (glibc 2.28) with a current GCC: the result runs on Rocky / Alma 8 and 9,
    # RHEL, Ubuntu 20.04+, Debian 11+ - what studios run.
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          dnf install -y libX11-devel libXrandr-devel libXinerama-devel libXcursor-devel libXi-devel \
                         mesa-libGL-devel git
          dnf install -y nasm || dnf --enablerepo=powertools install -y nasm || true
          git config --global --add safe.directory '*'
          pipx install cmake || true; pipx install ninja || true
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH" 2>/dev/null || echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dnf install -y ninja-build || true
      - uses: actions/cache@v4
        with:
          path: ../deps
          key: deps-linux-${{ hashFiles('tools/build_ocio.sh', 'tools/build_ffmpeg.sh', 'tools/build_ncnn.sh') }}
      - name: dependencies (OpenColorIO, FFmpeg, ncnn)
        run: |
          D=$(cd .. && pwd)/deps
          which cmake ninja gcc g++ git python3 || true; gcc --version | head -1
          [ -f $D/ocio-linux/lib/libOpenColorIO.a ] || tools/ci_run.sh OpenColorIO tools/build_ocio.sh $D/src $D/ocio-linux
          [ -f $D/ffmpeg-linux/lib/libavcodec.a ] || tools/ci_run.sh FFmpeg tools/build_ffmpeg.sh $D/src $D/ffmpeg-linux "" $D/ocio-linux
          if [ ! -f $D/ncnn-linux/lib/cmake/ncnn/ncnnConfig.cmake ]; then
            [ -d $D/src/ncnn ] || { git clone -q --depth 1 --branch 20250916 https://github.com/Tencent/ncnn.git $D/src/ncnn &&
                                    git -C $D/src/ncnn submodule update --init --depth 1 glslang; }
            tools/ci_run.sh ncnn tools/build_ncnn.sh $D/src/ncnn $D/ncnn-linux
          fi
      - run: tools/ci_run.sh "Linux package" tools/package_linux.sh
        env:
          WELDER_REQUIRE_NCNN: "1"  # a release without the RIFE node fails instead of shipping
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "dist/*.tar.gz"

  macos:
    # Mac minutes cost 10x on private repositories: only for version tags and when run by hand
    # (Actions > build > Run workflow). Free and unlimited once the repository is public.
    if: (github.event_name == 'workflow_dispatch' && (inputs.platforms == 'all' || inputs.platforms == 'macos')) || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - { runner: macos-14, arch: arm64 }          # Apple silicon (macos-15 arm64 runners are often unavailable)
          - { runner: macos-15-intel, arch: x86_64 }   # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja nasm || true
      - uses: actions/cache@v4
        with:
          path: ../deps
          key: deps-macos-${{ matrix.arch }}-${{ hashFiles('tools/build_ocio.sh', 'tools/build_ffmpeg.sh', 'tools/build_ncnn.sh') }}
      - name: build and package
        env:
          STRATA_BUILD_DEPS: ${{ (github.event_name == 'workflow_dispatch' && !inputs.mac_deps) && '0' || '1' }}
          # signing / notarization, once there is an Apple Developer account (repository secrets):
          MAC_SIGN_ID: ${{ secrets.MAC_SIGN_ID }}
        run: tools/ci_run.sh "macOS package" tools/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: "dist/*.zip"

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix ninja-build nasm cmake
      - uses: actions/cache@v4
        with:
          path: ../deps
          key: deps-windows-${{ hashFiles('tools/build_ocio.sh', 'tools/build_ffmpeg.sh', 'tools/build_ncnn.sh', 'tools/fetch_python_win.sh') }}
      - name: dependencies (OpenColorIO, FFmpeg, ncnn)
        run: |
          D=$(cd .. && pwd)/deps
          [ -f $D/ocio-win/lib/libOpenColorIO.a ] || tools/build_ocio.sh $D/src $D/ocio-win --windows
          [ -f $D/ffmpeg-win/lib/libavcodec.a ] || tools/build_ffmpeg.sh $D/src $D/ffmpeg-win --windows $D/ocio-win
          if [ ! -f $D/ncnn-win/lib/cmake/ncnn/ncnnConfig.cmake ]; then
            [ -d $D/src/ncnn ] || { git clone -q --depth 1 --branch 20250916 https://github.com/Tencent/ncnn.git $D/src/ncnn &&
                                    git -C $D/src/ncnn submodule update --init --depth 1 glslang; }
            tools/build_ncnn.sh $D/src/ncnn $D/ncnn-win --windows
          fi
      - run: tools/ci_run.sh "Windows package" tools/package_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "dist/*.zip"

  release:
    # Windows and Linux are enough to publish: a Mac build that fails or can't get a machine
    # (GitHub's Apple silicon runners are often short) doesn't hold the release back.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' && needs.windows.result == 'success'
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
